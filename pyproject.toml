[project]
name = "agnes-media-mcp"
version = "0.1.0"
description = "FastMCP server for Agnes image and video generation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.2,<2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agnes-media-mcp = "agnes_media_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnes_media_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
